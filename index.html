<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Character Sheet</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>
	<div>
		<!--Divisions-->
		<!--name and image-->
		<div class="head"> <!-- head section -->

			<img class="picture" src="">

			<div class="head-right"> <!--name-->

				<div class="name-plate">
					<h1>Name</h1>
				</div>
		
				<div class="meta-row">

					<div class="meta-badge">Role : </div>
					<div class="meta-badge">Class : </div>
					<div class="meta-badge">Level : </div>

				</div>

				<div class="stats-row">

					<div class="stat">STR</div>
					<div class="stat">DEX</div>
					<div class="stat">CON</div>
					<div class="stat">INT</div>
					<div class="stat">WIS</div>
					<div class="stat">CHA</div>

				</div>

			</div>

		</div>

	
		<!--Hard Skills-->

		<div class="skills-grid">

			<!--Hard Skills-->
			<div class="panel hard-skills">

				<h2>Hard Skills</h2>
				<ul>
					<li>Coding</li>
				</ul>

			</div>

			<!--Soft Skills-->
			<div class="panel soft-skills">

				<h2>Soft Skills</h2>
				<ul>
					<li>Curiosity</li>
				</ul>

			</div>

			<!--Strenghts Skills-->
			<div class="panel strenghts">

				<h2>Soft Strenghts</h2> <!--There's no "strenghts" class right now, I need to create one-->
				<ul>
					<li>Creativity</li>
				</ul>

			</div>

			<!--Hobbies-->
			<div class="panel hobbies"><!--There's no "hobbies" class right now, I need to create one-->

				<h2>Hobbies</h2>
				<ul>
					<li>Crochet</li>
				</ul>

			</div>

		<footer>
			<p>Contact : | Linkedin : <a href="">link</a> | <a href="">CV</a></p>
		</footer>
	</div>
</body>
</html>
